name: Verify Config Mirrors

on:
  push:
    paths:
      - 'config/**'
      - 'scripts/check_mirrors.py'
      - '.github/workflows/verify-config.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirrors:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Config sanity (CONFIG_SANITY)
        run: |
          python - <<'PYEOF'
          import json, re, sys
          d = json.load(open('config/jsm.json', encoding='utf-8-sig'))
          sites = d.get('sites') or []
          errs = []
          if len(d.get('urls') or []) == 0 and len(sites) < 10:
              errs.append('too few sites: %d (<10)' % len(sites))
          keys = [s.get('key') or s.get('name') for s in sites]
          dup = {k for k in keys if keys.count(k) > 1}
          if dup:
              errs.append('duplicate keys: %s' % list(dup)[:5])
          bad = [s.get('name') for s in sites if s.get('name') and any(0xD800 <= ord(c) <= 0xDFFF for c in s['name'])]
          if bad:
              errs.append('mojibake names: %s' % bad[:5])
          if d.get('spider') and ';md5;' not in str(d['spider']):
              errs.append('spider without md5')
          if errs:
              print('CONFIG_BAD'); [print(' -', e) for e in errs]; sys.exit(1)
          print('CONFIG_OK sites=%d spider=%s' % (len(sites), bool(d.get('spider'))))
          PYEOF

      - name: Check mirrors converge
        run: python scripts/check_mirrors.py --wait 600
