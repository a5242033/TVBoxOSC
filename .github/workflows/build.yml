name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare Build Tag
        run: |
          echo "tag=$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV
          echo "commitS=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV
          echo "verC=$(date +%y%m%d%H)" >> $GITHUB_ENV

      - name: Checkout Source Code
        run: |
          git clone --depth 1 https://github.com/q215613905/TVBoxOS TVBoxOSC

      - name: Extra Modify
        working-directory: TVBoxOSC
        run: |
          echo '修改VersionName'
          sed -i "/versionName/s#[0-9a-zA-Z_\.\'\"-]\+\$#\'${{ env.tag }}\'#" app/build.gradle
          echo '修改versionCode为日期递增，保证覆盖安装'
          sed -i "/versionCode/s#[0-9]\+\$#${{ env.verC }}#" app/build.gradle
          sed -i "/android:text=/s#=\"#=\"${{ env.tag }}\\\\n\\\\n#" app/src/main/res/layout/dialog_about.xml
          echo 'crosswalk源，防挂'
          if grep -q 'crosswalk' build.gradle; then
            sed -i "/crosswalk/a\        maven { url 'https://j4uq.github.io/crosswalk/releases/crosswalk/android/maven2' }" build.gradle
          else
            sed -i "/jitpack.io/a\        maven { url 'https://j4uq.github.io/crosswalk/releases/crosswalk/android/maven2' }" build.gradle
          fi
          echo '注入默认配置地址（开箱自带，无需手动填）'
          python3 - <<'PYEOF'
          p = 'app/src/main/java/com/github/tvbox/osc/base/App.java'
          s = open(p, encoding='utf-8').read()
          anchor = 'Hawk.init(this).build();'
          block = '''Hawk.init(this).build();
                  String defApi = Hawk.get(HawkConfig.API_URL, "");
                  boolean legacy = defApi != null && (defApi.contains("qist.wyfc.qzz.io/jsm.json") || defApi.contains("xhztv.top") || defApi.contains("cdn.jsdelivr.net") || defApi.contains("gh.llkk.cc") || defApi.contains("gh-proxy.com/https://raw.githubusercontent.com/a5242033"));
                  if (defApi == null || defApi.isEmpty() || legacy) {
                      Hawk.put(HawkConfig.API_URL, "https://ghfast.top/https://raw.githubusercontent.com/a5242033/TVBoxOSC/master/config/jsm.json");
                      java.util.ArrayList<String> defHistory = new java.util.ArrayList<>();
                      defHistory.add("https://ghfast.top/https://raw.githubusercontent.com/a5242033/TVBoxOSC/master/config/jsm.json");
                      defHistory.add("https://gh-proxy.com/https://raw.githubusercontent.com/a5242033/TVBoxOSC/master/config/jsm.json");
                      defHistory.add("https://qist.wyfc.qzz.io/jsm.json");
                      Hawk.put(HawkConfig.API_HISTORY, defHistory);
                  }
                  if (!Hawk.contains(HawkConfig.HOME_REC_STYLE)) {
                      Hawk.put(HawkConfig.HOME_REC_STYLE, true);
                  }
                  // 直播连接超时：默认 (值+1)*5s = 10s，两条线路都死要等 20s；压到 0 => 5s
                  if (!Hawk.contains(HawkConfig.LIVE_CONNECT_TIMEOUT)) {
                      Hawk.put(HawkConfig.LIVE_CONNECT_TIMEOUT, 0);
                  }'''
          assert anchor in s, 'anchor not found'
          s = s.replace(anchor, block, 1)
          open(p, 'w', encoding='utf-8').write(s)
          print('default config patched')
          PYEOF
          echo 'JarLoader: normal jar tries Init.init() first'
          python3 - <<'PYEOF'
          import re, sys
          p = 'app/src/main/java/com/github/catvod/crawler/JarLoader.java'
          s = open(p, encoding='utf-8').read()
          if 'echo---normal-init-ok' in s:
              print('jarloader already patched')
              sys.exit(0)
          m = re.search(r'\n([ \t]*)protectedJar\s*=\s*protectedInitJar\.check\(jar\);', s)
          if not m:
              print('JARLOADER-ANCHOR-MISS head=%r' % s[:400])
              sys.exit(1)
          ind = m.group(1)
          ins = ('\n' + ind + 'try {'
                 + '\n' + ind + '    Method m0 = clz.getMethod("init", Context.class);'
                 + '\n' + ind + '    m0.invoke(null, App.getInstance());'
                 + '\n' + ind + '    Log.i(TAG, "echo---normal-init-ok");'
                 + '\n' + ind + '    return true;'
                 + '\n' + ind + '} catch (Throwable ignored) {'
                 + '\n' + ind + '}')
          s = s[:m.start()] + ins + s[m.start():]
          assert 'echo---normal-init-ok' in s
          open(p, 'w', encoding='utf-8').write(s)
          print('jarloader patched, indent=%r' % ind)
          PYEOF
          echo 'HomeActivity: 6h 内优先用本地配置缓存（开屏不再每次等网络）'
          python3 - <<'PYEOF'
          import sys
          p = 'app/src/main/java/com/github/tvbox/osc/ui/activity/HomeActivity.java'
          s = open(p, encoding='utf-8').read()
          if 'FAST_START_CACHE_TTL' in s:
              print('home cache patch already applied')
              sys.exit(0)
          anchor = '            useCacheConfig = bundle.getBoolean("useCache", false);\n        }\n'
          if anchor not in s:
              print('HOME-ANCHOR-MISS head=%r' % s[:300])
              sys.exit(1)
          inject = anchor + (
              '        // FAST_START_CACHE_TTL: 6h 内直接用本地配置缓存\n'
              '        if (!useCacheConfig) {\n'
              '            try {\n'
              '                String _api = Hawk.get(HawkConfig.API_URL, "");\n'
              '                if (!_api.isEmpty()) {\n'
              '                    File _cache = new File(com.github.tvbox.osc.base.App.getInstance().getFilesDir().getAbsolutePath() + "/" + MD5.encode(_api));\n'
              '                    long FAST_START_CACHE_TTL = 6L * 60L * 60L * 1000L;\n'
              '                    if (_cache.exists() && System.currentTimeMillis() - _cache.lastModified() < FAST_START_CACHE_TTL) {\n'
              '                        useCacheConfig = true;\n'
              '                    }\n'
              '                }\n'
              '            } catch (Throwable ignored) {\n'
              '            }\n'
              '        }\n')
          s = s.replace(anchor, inject, 1)
          open(p, 'w', encoding='utf-8').write(s)
          print('home cache-first patched')
          PYEOF
          echo 'LivePlayActivity: 开播前并行探线，死线不再干等超时'
          python3 - <<'PYEOF'
          import sys
          p = 'app/src/main/java/com/github/tvbox/osc/ui/activity/LivePlayActivity.java'
          s = open(p, encoding='utf-8').read()
          if 'LIVE_RACE' in s:
              print('live race already patched'); sys.exit(0)
          anchor = '    private boolean canReusePlayer(int previousLivePlayerType) {'
          if anchor not in s:
              print('RACE-ANCHOR-MISS'); sys.exit(1)
          helpers = (
              '    // LIVE_RACE: 开播前并行探测前几条线路，谁先回谁上，避免死线干等 5s 超时\n'
              '    private int raceBestSourceIndex(final com.github.tvbox.osc.bean.LiveChannelItem item) {\n'
              '        try {\n'
              '            java.util.ArrayList<String> urls = item.getChannelUrls();\n'
              '            if (urls == null || urls.size() <= 1) return -1;\n'
              '            int n = Math.min(urls.size(), 4);\n'
              '            java.util.concurrent.ExecutorService ex = java.util.concurrent.Executors.newFixedThreadPool(n);\n'
              '            java.util.concurrent.CompletionService<Integer> cs = new java.util.concurrent.ExecutorCompletionService<Integer>(ex);\n'
              '            for (int i = 0; i < n; i++) {\n'
              '                final int idx = i;\n'
              '                final String u = urls.get(i);\n'
              '                cs.submit(new java.util.concurrent.Callable<Integer>() {\n'
              '                    public Integer call() {\n'
              '                        return probeLiveLine(u) ? Integer.valueOf(idx) : null;\n'
              '                    }\n'
              '                });\n'
              '            }\n'
              '            Integer best = null;\n'
              '            long deadline = System.currentTimeMillis() + 1600;\n'
              '            for (int i = 0; i < n; i++) {\n'
              '                long left = deadline - System.currentTimeMillis();\n'
              '                if (left <= 0) break;\n'
              '                java.util.concurrent.Future<Integer> f = cs.poll(left, java.util.concurrent.TimeUnit.MILLISECONDS);\n'
              '                if (f == null) break;\n'
              '                best = f.get();\n'
              '                if (best != null) break;\n'
              '            }\n'
              '            ex.shutdownNow();\n'
              '            if (best != null && best.intValue() != item.getSourceIndex()) {\n'
              '                LOG.i("echo-live-race pick " + best + " of " + n);\n'
              '                return best.intValue();\n'
              '            }\n'
              '            return -1;\n'
              '        } catch (Throwable th) {\n'
              '            return -1;\n'
              '        }\n'
              '    }\n'
              '\n'
              '    private boolean probeLiveLine(String url) {\n'
              '        java.net.HttpURLConnection c = null;\n'
              '        try {\n'
              '            c = (java.net.HttpURLConnection) new java.net.URL(url).openConnection();\n'
              '            c.setConnectTimeout(1200);\n'
              '            c.setReadTimeout(1200);\n'
              '            c.setInstanceFollowRedirects(true);\n'
              '            c.setRequestProperty("User-Agent", "okhttp/3.8.1");\n'
              '            c.setRequestProperty("Range", "bytes=0-1023");\n'
              '            int code = c.getResponseCode();\n'
              '            return code >= 200 && code < 400;\n'
              '        } catch (Throwable th) {\n'
              '            return false;\n'
              '        } finally {\n'
              '            try { if (c != null) c.disconnect(); } catch (Throwable ignored) {}\n'
              '        }\n'
              '    }\n'
              '\n'
          )
          s = s.replace(anchor, helpers + anchor, 1)
          old = '            String liveUrl = currentLiveChannelItem.getUrl();\n'
          if old not in s:
              print('RACE-USE-ANCHOR-MISS'); sys.exit(1)
          new = (
              '            String liveUrl = currentLiveChannelItem.getUrl();\n'
              '            if (Hawk.get("live_race_enable", true)) {\n'
              '                int _best = raceBestSourceIndex(currentLiveChannelItem);\n'
              '                if (_best >= 0) {\n'
              '                    currentLiveChannelItem.setSourceIndex(_best);\n'
              '                    liveUrl = currentLiveChannelItem.getUrl();\n'
              '                }\n'
              '            }\n'
          )
          s = s.replace(old, new, 1)
          open(p, 'w', encoding='utf-8').write(s)
          print('live race patched')
          PYEOF
          echo 'App.onCreate: 清缓存放后台、QuickJS 延后初始化'
          python3 - <<'PYEOF'
          import sys
          p = 'app/src/main/java/com/github/tvbox/osc/base/App.java'
          s = open(p, encoding='utf-8').read()
          if 'DEFER_QUICKJS' in s:
              print('already patched'); sys.exit(0)
          old = '        PlayerHelper.init();\n        QuickJSLoader.init();\n        FileUtils.cleanPlayerCache();\n'
          if old not in s:
              print('APP-INIT-ANCHOR-MISS'); sys.exit(1)
          new = (
              '        PlayerHelper.init();\n'
              '        // DEFER_QUICKJS:  JS 引擎不占开屏，延后 1.2s 再加载\n'
              '        new android.os.Handler(android.os.Looper.getMainLooper()).postDelayed(new Runnable() {\n'
              '            public void run() {\n'
              '                try { QuickJSLoader.init(); } catch (Throwable ignored) {}\n'
              '            }\n'
              '        }, 1200);\n'
              '        // 清播放器缓存挪到后台线程\n'
              '        new Thread(new Runnable() {\n'
              '            public void run() {\n'
              '                try { FileUtils.cleanPlayerCache(); } catch (Throwable ignored) {}\n'
              '            }\n'
              '        }).start();\n')
          s = s.replace(old, new, 1)
          open(p, 'w', encoding='utf-8').write(s)
          print('app init patched')
          PYEOF
          echo 'HomeActivity: 过滤成人向分类标签'
          python3 - <<'PYEOF'
          import sys
          p = 'app/src/main/java/com/github/tvbox/osc/ui/activity/HomeActivity.java'
          s = open(p, encoding='utf-8').read()
          if 'DIRTY_FILTER' in s:
              print('already patched'); sys.exit(0)
          old = '        if (newSortData == null) {\n            newSortData = new ArrayList<>();\n        }\n'
          if old not in s:
              print('UPDATE-SORT-ANCHOR-MISS'); sys.exit(1)
          add = (
              '        // DIRTY_FILTER: 去掉成人向分类标签（伦理/福利/写真/三级/无码/里番/情色/成人/少妇）\n'
              '        try {\n'
              '            java.util.Iterator<MovieSort.SortData> _it = newSortData.iterator();\n'
              '            while (_it.hasNext()) {\n'
              '                MovieSort.SortData _sd = _it.next();\n'
              '                if (_sd != null && _sd.name != null && _sd.name.matches(".*(伦理|福利|写真|三级|无码|里番|情色|成人|少妇).*")) {\n'
              '                    _it.remove();\n'
              '                }\n'
              '            }\n'
              '        } catch (Throwable ignored) {}\n')
          s = s.replace(old, old + add, 1)
          open(p, 'w', encoding='utf-8').write(s)
          print('dirty filter patched')
          PYEOF
          echo 'SourceViewModel: 分类(sort)结果落盘，冷启动直接用上次的分类立即出墙'
          python3 - <<'PYEOF'
          import sys
          p = 'app/src/main/java/com/github/tvbox/osc/viewmodel/SourceViewModel.java'
          s = open(p, encoding='utf-8').read()
          if 'SORT_DISK_CACHE' in s:
              print('sort cache patch already applied')
              sys.exit(0)
          anchor = '    // homeContent\n    public void getSort(final String sourceKey) {\n'
          if anchor not in s:
              print('SORT-ANCHOR-MISS')
              sys.exit(1)
          helpers = (
              '    // SORT_DISK_CACHE: 分类结果落盘，冷启动先出上一次的分类，避免白等一次网络\n'
              '    private java.io.File sortCacheFile(String key) {\n'
              '        return new java.io.File(com.github.tvbox.osc.base.App.getInstance().getFilesDir(), "sortcache_" + key.replaceAll("[^A-Za-z0-9]", "_"));\n'
              '    }\n'
              '    private void saveSortJson(String key, String json) {\n'
              '        try {\n'
              '            java.io.FileOutputStream fo = new java.io.FileOutputStream(sortCacheFile(key));\n'
              '            fo.write(json.getBytes("UTF-8"));\n'
              '            fo.close();\n'
              '        } catch (Throwable ignored) {\n'
              '        }\n'
              '    }\n'
              '    private String loadSortJson(String key, long ttlMs) {\n'
              '        try {\n'
              '            java.io.File f = sortCacheFile(key);\n'
              '            if (f.exists() && System.currentTimeMillis() - f.lastModified() < ttlMs) {\n'
              '                byte[] b = new byte[(int) f.length()];\n'
              '                java.io.FileInputStream fi = new java.io.FileInputStream(f);\n'
              '                fi.read(b);\n'
              '                fi.close();\n'
              '                return new String(b, "UTF-8");\n'
              '            }\n'
              '        } catch (Throwable ignored) {\n'
              '        }\n'
              '        return null;\n'
              '    }\n'
          )
          s = s.replace(anchor, helpers + anchor, 1)
          # 内存缓存未命中时，先尝试磁盘缓存（仅 type 0/1）
          mem = '        if (!shouldBypassSortCache(sourceKey, sourceBean)) {\n            AbsSortXml cached = sortCache.get(sourceKey);\n'
          if mem not in s:
              print('SORT-MEM-ANCHOR-MISS')
              sys.exit(1)
          disk = mem + (
              '            if (cached == null && sourceBean.getType() == 1) {\n'
              '                String _diskJson = loadSortJson(sourceKey, 2L * 60L * 60L * 1000L);\n'
              '                if (_diskJson != null) {\n'
              '                    AbsSortXml _diskXml = sortJson(sortResult, _diskJson);\n'
              '                    if (_diskXml != null && _diskXml.list != null) {\n'
              '                        attachSortSource(sourceKey, _diskXml);\n'
              '                        postSortResult(sourceKey, _diskXml);\n'
              '                        return;\n'
              '                    }\n'
              '                }\n'
              '            }\n'
          )
          s = s.replace(mem, disk, 1)
          # 网络拿到分类后落盘
          save_anchor = '                                String json = response.body();\n                                sortXml = sortJson(sortResult, json);\n'
          if save_anchor not in s:
              print('SORT-SAVE-ANCHOR-MISS')
              sys.exit(1)
          s = s.replace(save_anchor,
                        '                                String json = response.body();\n'
                        '                                saveSortJson(sourceKey, json);\n'
                        '                                sortXml = sortJson(sortResult, json);\n', 1)
          open(p, 'w', encoding='utf-8').write(s)
          print('sort disk cache patched')
          PYEOF

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.8'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install lxml ujson pyquery requests jsonpath cachetools pycryptodome beautifulsoup4

      - name: Modify pyramid——build.gradle
        working-directory: TVBoxOSC
        run: |
          sed -i '/buildPython.*python.exe/d' pyramid/build.gradle

      - name: Setup Python local.properties
        working-directory: TVBoxOSC
        run: echo "" > local.properties

      - name: Release Apk Sign
        working-directory: TVBoxOSC
        run: |
          signingConfigs=''
          signingConfig='ICAgICAgICAgICAgaWYgKHByb2plY3QuaGFzUHJvcGVydHkoIlJFTEVBU0VfU1RPUkVfRklMRSIpKSB7XAogICAgICAgICAgICAgICAgc2lnbmluZ0NvbmZpZyBzaWduaW5nQ29uZmlncy5teUNvbmZpZ1wKICAgICAgICAgICAgfVwK'
          signingConfigs="$(echo "$signingConfigs" |base64 -d )"
          signingConfig="$(echo "$signingConfig" |base64 -d )"
          sed -i -e "/defaultConfig {/i\\$signingConfigs " -e "/debug {/a\\$signingConfig " -e "/release {/a\\$signingConfig " app/build.gradle
          cp -f ${{ github.workspace }}/.github/workflows/TVBoxOSC.jks app/TVBoxOSC.jks
          sed -i '$a\RELEASE_STORE_FILE=./TVBoxOSC.jks'     ./gradle.properties
          sed -i '$a\RELEASE_KEY_ALIAS=TVBoxOSC'            ./gradle.properties
          sed -i '$a\RELEASE_STORE_PASSWORD=TVBoxOSC'       ./gradle.properties
          sed -i '$a\RELEASE_KEY_PASSWORD=TVBoxOSC'         ./gradle.properties

      - uses: gradle/actions/setup-gradle@v6.2.0

      - name: Build With Gradle
        working-directory: TVBoxOSC
        run: |
          chmod +x gradlew
          ./gradlew assemblerelease --build-cache --parallel --daemon --warning-mode all

      - name: Prepare App
        working-directory: TVBoxOSC
        run: |
          rm -rf apk/
          mkdir -p apk/
          i=0
          for file in `find ~ -name "*release*.apk" -print`; do
            i=$((i+1))
            mv "$file" "apk/TVBox_自用版_${{ env.tag }}_${i}.apk"
          done

      - name: Upload App To Artifact
        uses: actions/upload-artifact@v7
        with:
          name: TVBox-自用版
          path: |
            TVBoxOSC/apk/*

      - name: Release and Upload Assets
        uses: ncipollo/release-action@v1
        with:
          name: ${{ env.tag }}
          tag: ${{ env.tag }}
          body: "自用版：内置默认配置地址（jsm.json + 4k.json历史），安装即用"
          allowUpdates: true
          artifacts: |
            TVBoxOSC/apk/*.apk
            config/jsm.json
            config/jsm-repo.json
            config/live.m3u
