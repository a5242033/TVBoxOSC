                              java.net.HttpURLConnection conn = (java.net.HttpURLConnection) new java.net.URL(sd[1]).openConnection();
                              conn.setConnectTimeout(4000);
                              conn.setReadTimeout(6000);
                              conn.setRequestProperty("User-Agent", "okhttp/3.8.1");
                              java.io.InputStream in = conn.getInputStream();
                              java.io.ByteArrayOutputStream bos = new java.io.ByteArrayOutputStream();
                              byte[] buf = new byte[8192];
                              int n;
                              while ((n = in.read(buf)) > 0) bos.write(buf, 0, n);
                              in.close();
                              byte[] body = bos.toByteArray();
                              if (body.length > 100) {
                                  if (isA) listA = body; else listB = body;
                                  LOG.i("echo-live-proxy ok list" + sd[0] + " url:" + sd[1] + " len:" + body.length);
                              }
                          } catch (Throwable th2) {
                              LOG.e("echo-live-proxy try fail " + sd[1] + ": " + th2.getMessage());
                          }
                      }
                      if (listA == null) listA = listB;
                      String merged = mergeLiveM3u(listA, listB);
                      if (merged != null && merged.length() > 100) {
                          LOG.i("echo-live-proxy merged len:" + merged.length());
                          return merged.getBytes("UTF-8");
                      }
                      return listA != null ? listA : listB;
                  } catch (Throwable th) {
                      LOG.e("echo-live-proxy error: " + th.getMessage());
                      return null;
                  }
              }

