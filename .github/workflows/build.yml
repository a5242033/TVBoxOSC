                      if (liveUrl.startsWith("http")) tryUrls.add(new String[]{"a", liveUrl});
                  }
                  tryUrls.add(new String[]{"a", "https://gh-proxy.com/https://raw.githubusercontent.com/fanmingming/live/main/tv/m3u/ipv6.m3u"});
                  tryUrls.add(new String[]{"a", "https://iptv-org.github.io/iptv/countries/cn.m3u"});
                  tryUrls.add(new String[]{"b", "https://gh-proxy.com/https://raw.githubusercontent.com/Guovin/iptv-api/gd/output/result.m3u"});
                  tryUrls.add(new String[]{"b", "https://raw.githubusercontent.com/Guovin/iptv-api/gd/output/result.m3u"});
                  byte[] listA = null;
                  byte[] listB = null;
                  for (String[] sd : tryUrls) {
                      boolean isA = "a".equals(sd[0]);
                      if ((isA && listA != null) || (!isA && listB != null)) continue;
                      try {
                          LOG.i("echo-live-proxy try " + sd[1]);
                          java.net.HttpURLConnection conn = (java.net.HttpURLConnection) new java.net.URL(sd[1]).openConnection();
                          conn.setConnectTimeout(6000);
                          conn.setReadTimeout(12000);
                          conn.setRequestProperty("User-Agent", "okhttp/3.8.1");
                          java.io.InputStream in = conn.getInputStream();
                          java.io.ByteArrayOutputStream bos = new java.io.ByteArrayOutputStream();
                          byte[] buf = new byte[8192];
                          int n;
                          while ((n = in.read(buf)) > 0) bos.write(buf, 0, n);
                          in.close();
                          byte[] body = bos.toByteArray();
                          if (body.length > 100) {
                              if (isA) listA = body; else listB = body;
                              LOG.i("echo-live-proxy ok list" + sd[0] + " url:" + sd[1] + " len:" + body.length);
                          }
                      } catch (Throwable th2) {
                          LOG.e("echo-live-proxy try fail " + sd[1] + ": " + th2.getMessage());
                      }
                  }
                  String merged = mergeLiveM3u(listA, listB);
                  if (merged != null && merged.length() > 100) {
                      LOG.i("echo-live-proxy merged len:" + merged.length());
                      return new Object[]{200, "text/plain", new java.io.ByteArrayInputStream(merged.getBytes("UTF-8"))};
                  }
                  byte[] fallback = listA != null ? listA : listB;
                  if (fallback != null) return new Object[]{200, "text/plain", new java.io.ByteArrayInputStream(fallback)};
              } catch (Throwable th) {
                  LOG.e("echo-live-proxy error: " + th.getMessage());
              }
          }'''
          patch(ac, pl_old, pl_new)
          print('patched: live txt proxy dual-source merge (IPv4-first line ordering)')
          lp = 'app/src/main/java/com/github/tvbox/osc/ui/activity/LivePlayActivity.java'
          lp1_old = '    public void loadProxyLives(String url) {\n        try {\n            Uri parsedUrl = Uri.parse(url);'
          lp1_new = '    public void loadProxyLives(String url) {\n        String __proxyUrl = url;\n        try {\n            Uri parsedUrl = Uri.parse(url);'
          patch(lp, lp1_old, lp1_new)
          lp2_old = '            OkGo.<String>get(url).execute(new AbsCallback<String>() {'
          lp2_new = '            OkGo.<String>get(__proxyUrl.startsWith("http://127.0.0.1") ? __proxyUrl : "http://127.0.0.1:9978/proxy?do=live&type=txt&ext=" + Base64.encodeToString(url.getBytes(), Base64.DEFAULT | Base64.URL_SAFE | Base64.NO_WRAP)).execute(new AbsCallback<String>() {'
          patch(lp, lp2_old, lp2_new)
          print('patched: live txt fetch via local proxy (multi-URL fallback)')
          print('patched: live dual-source merge + local proxy routing complete')
          PYEOF2

